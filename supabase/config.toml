# Supabase CLI settings for the SAR Edge Function. Only the [functions] block
# matters here; this repository does not manage the database with the CLI.
project_id = "sar2"

[functions.sar2-api]
# Login requests are public but restricted to the private membership list.
# Every data request verifies Operations Auth and enabled SAR membership in
# server/api-core.mjs before reading data. Credentials remain server-only.
verify_jwt = false
